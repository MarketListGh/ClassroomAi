<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClassroomAI - Learn Smarter</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: "Segoe UI", sans-serif;
}

/* BACKGROUND */
body{
  height:100vh;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

/* MAIN CONTAINER */
.container{
  width:95%;
  max-width:1000px;
  background:white;
  border-radius:20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,0.2);
}

/* LEFT SIDE */
.left{
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  padding:40px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  color:white;
}

.left h1{
  font-size:32px;
  margin-bottom:10px;
}

.left p{
  opacity:0.9;
  line-height:1.5;
}

/* RIGHT SIDE */
.right{
  padding:40px;
  color:#333;
}

/* TEACHER CARD */
.teacher{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.avatar{
  width:60px;
  height:60px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
}

.teacher h2{
  font-size:18px;
}

.teacher small{
  color:#777;
}

/* INPUTS */
.input-group{
  margin-top:20px;
}

.input-group label{
  display:block;
  margin-bottom:5px;
  font-weight:600;
}

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:14px;
}

/* BUTTON */
button{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#1d4ed8;
}

/* FOOTER TEXT */
.note{
  margin-top:15px;
  font-size:12px;
  color:#888;
  text-align:center;
}

/* MOBILE */
@media(max-width:800px){
  .container{
    grid-template-columns:1fr;
  }
  .left{
    display:none;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- LEFT SIDE -->
<div class="left">
  <h1>🎓 ClassroomAI</h1>
  <p>
    Learn faster with your personal AI teacher.<br><br>
    Get simple explanations, real examples, and step-by-step lessons designed for students.
  </p>
</div>

<!-- RIGHT SIDE -->
<div class="right">

  <div class="teacher">
    <div class="avatar"></div>
    <div>
      <h2>Mr. Kwame Mensah</h2>
      <small>Your AI Teacher</small>
    </div>
  </div>

  <h3>Start Learning</h3>

  <div class="input-group">
    <label>Your Name</label>
    <input id="name" placeholder="e.g. Amina">
  </div>

  <div class="input-group">
    <label>Subject</label>
    <input id="subject" placeholder="e.g. Economics">
  </div>

  <div class="input-group">
    <label>Topic (optional)</label>
    <input id="topic" placeholder="e.g. Demand and Supply">
  </div>

  <button onclick="startLearning()">🚀 Start Lesson</button>

  <div class="note">
    Your progress will be saved automatically
  </div>

</div>

</div>

<script>
function startLearning(){
  const name = document.getElementById("name").value.trim();
  const subject = document.getElementById("subject").value.trim();
  const topic = document.getElementById("topic").value.trim();

  if(!name || !subject){
    alert("Please enter your name and subject");
    return;
  }

  // Save data
  localStorage.setItem("studentName", name);
  localStorage.setItem("subject", subject);
  localStorage.setItem("topic", topic);

  // Initialize if first time
  if(!localStorage.getItem("xp")){
    localStorage.setItem("xp", 0);
  }

  // Go to lesson page
  window.location.href = "lesson.html";
}
</script>

</body>
</html>
