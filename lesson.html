<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lesson - ClassroomAI</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

/* BACKGROUND */
body{
  background: linear-gradient(135deg,#4facfe,#00f2fe);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* MAIN CONTAINER */
.container{
  width:95%;
  max-width:1100px;
  height:90vh;
  background:white;
  border-radius:20px;
  display:grid;
  grid-template-columns:2fr 1fr;
  overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,0.2);
}

/* LEFT SIDE */
.left{
  display:flex;
  flex-direction:column;
  padding:20px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header h2{
  color:#2563eb;
}

/* PROGRESS */
.progress{
  height:8px;
  background:#eee;
  border-radius:10px;
  margin-top:10px;
}

.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#22c55e,#4ade80);
}

/* CHAT */
.chat{
  flex:1;
  margin-top:15px;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.msg{
  padding:12px;
  border-radius:12px;
  max-width:75%;
  line-height:1.4;
}

.teacher{
  background:#e0f2fe;
}

.student{
  background:#d1fae5;
  align-self:flex-end;
}

/* INPUT AREA */
.input-area{
  display:flex;
  gap:10px;
  margin-top:10px;
}

input{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
}

button{
  padding:12px 16px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* RIGHT SIDE */
.right{
  background:#f9fafb;
  padding:20px;
  border-left:1px solid #eee;
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* TEACHER */
.teacher-box{
  text-align:center;
}

.avatar{
  width:70px;
  height:70px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  margin:auto;
}

.teacher-box h3{
  margin-top:10px;
}

/* SUBJECTS */
.subjects{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.subject{
  padding:6px 10px;
  background:#e2e8f0;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
}

/* STATS */
.stat{
  font-size:14px;
}

/* BUTTON */
.dashboard-btn{
  margin-top:auto;
  background:#22c55e;
}

/* MOBILE */
@media(max-width:900px){
  .container{
    grid-template-columns:1fr;
  }
  .right{
    display:none;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- LEFT -->
<div class="left">

<div class="header">
  <h2 id="title"></h2>
</div>

<div class="progress">
  <div id="bar" class="bar"></div>
</div>

<div id="chat" class="chat"></div>

<div class="input-area">
  <input id="input" placeholder="Ask your teacher anything...">
  <button onclick="send()">Send</button>
</div>

</div>

<!-- RIGHT -->
<div class="right">

<div class="teacher-box">
  <div class="avatar"></div>
  <h3>Mr. Kwame Mensah</h3>
  <small>AI Teacher</small>
</div>

<div>
  <h4>📚 Subjects</h4>
  <div class="subjects" id="subjects"></div>
</div>

<div>
  <h4>📊 Stats</h4>
  <div class="stat">XP: <span id="xp"></span></div>
  <div class="stat">Level: <span id="level"></span></div>
</div>

<button class="dashboard-btn" onclick="goDashboard()">Dashboard</button>

</div>

</div>

<script>

/* LOAD DATA */
const name = localStorage.getItem("studentName") || "Student";
let subject = localStorage.getItem("subject") || "General";
let topic = localStorage.getItem("topic") || "Introduction";

document.getElementById("title").innerText =
`${subject} - ${topic}`;

/* SUBJECT LIST */
const subjectList = [
"Mathematics","English","Economics","Government","CRS",
"Biology","Chemistry","Physics","ICT","Geography",
"Literature","Business","Accounting","Marketing",
"Entrepreneurship","Statistics","History","Sociology"
];

const subjectsDiv = document.getElementById("subjects");

subjectList.forEach(s=>{
  const el = document.createElement("div");
  el.className="subject";
  el.innerText=s;
  el.onclick=()=>{
    localStorage.setItem("subject",s);
    location.reload();
  };
  subjectsDiv.appendChild(el);
});

/* XP */
let xp = parseInt(localStorage.getItem("xp") || 0);

function updateStats(){
  document.getElementById("xp").innerText = xp;
  document.getElementById("level").innerText =
  Math.floor(xp/50)+1;
}
updateStats();

/* CHAT */
const chat = document.getElementById("chat");

function teacher(text){
  chat.innerHTML += `<div class="msg teacher">${text}</div>`;
  chat.scrollTop = chat.scrollHeight;
}

/* START LESSON */
teacher(`Hello ${name}! 👋`);
teacher(`Today we are learning ${topic} in ${subject}.`);
teacher(`Let me break it down simply for you.`);

/* SEND */
function send(){
  const input = document.getElementById("input");
  const text = input.value;

  if(!text) return;

  chat.innerHTML += `<div class="msg student">${text}</div>`;

  teacher("Great question! Here's a simple explanation...");

  input.value="";

  xp += 5;
  localStorage.setItem("xp",xp);

  updateStats();
  updateProgress();
}

/* PROGRESS */
let progress = 0;

function updateProgress(){
  progress += 10;
  document.getElementById("bar").style.width = progress+"%";
}

/* NAV */
function goDashboard(){
  window.location.href="dashboard.html";
}

</script>

</body>
</html>
